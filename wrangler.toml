name = "axissaunas-clone"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "axissaunas-db"
database_id = "local"

[[r2_buckets]]
binding = "R2"
bucket_name = "axissaunas-assets"

[vars]
NODE_ENV = "development"
NEXT_TELEMETRY_DISABLED = "1"