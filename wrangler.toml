# Cloudflare Pages project — this config is read by Pages during builds
# to wire up D1/R2 bindings. `pages_build_output_dir` tells Pages where the
# static assets live (OpenNext output).
name = "funing-website"
pages_build_output_dir = ".open-next"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Used by `wrangler deploy` (Workers mode) as an alternative deploy path.
# Ignored by Pages.
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "funing-db"
database_id = "e34f35c7-46c0-4547-a366-ada19c09af48"

[[r2_buckets]]
binding = "R2"
bucket_name = "funing-storage"

[vars]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"