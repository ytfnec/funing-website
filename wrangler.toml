# Cloudflare Workers deploy (via @opennextjs/cloudflare).
# Build with `npm run build:cf`, deploy with `npm run deploy` (wrangler deploy).
name = "funing-website"
main = ".open-next/worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "funing-db"
database_id = "e34f35c7-46c0-4547-a366-ada19c09af48"

[[r2_buckets]]
binding = "R2"
bucket_name = "funing-storage"

[vars]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"